apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-webapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-webapp
  template:
    metadata:
      labels:
        app: cicd-webapp
    spec:
      containers:
      - name: cicd-webapp
        image: cicd-webapp:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-webapp-service
spec:
  selector:
    app: cicd-webapp
  type: NodePort
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
